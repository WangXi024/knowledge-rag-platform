# 独立存储栈：只负责数据库、缓存、对象存储和检索引擎，不启动任何业务进程。
# PostgreSQL 与 Redis 都按“单物理实例、多逻辑边界”部署；停止时禁止使用 down -v。
# 存储使用独立 Compose Project，Docker Desktop 会把数据库与业务运行时分成两组。
# 下方卷名继续沿用历史名称，所以更换 Project 只重建容器，不改变已有持久化数据。
name: lazytt-rag-storage

services:
  postgres:
    # 一个 PostgreSQL 进程承载两个逻辑数据库。管理员只负责首次初始化；Gateway
    # 和 RAGFlow 始终使用各自的非管理员账号和数据库，API 层无需感知物理合并。
    image: ${POSTGRES_IMAGE}
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      APP_POSTGRES_DATABASE: ${APP_POSTGRES_DATABASE}
      APP_POSTGRES_USER: ${APP_POSTGRES_USER}
      APP_POSTGRES_PASSWORD: ${APP_POSTGRES_PASSWORD}
      RAGFLOW_POSTGRES_DATABASE: ${RAGFLOW_POSTGRES_DATABASE}
      RAGFLOW_POSTGRES_USER: ${RAGFLOW_POSTGRES_USER}
      RAGFLOW_POSTGRES_PASSWORD: ${RAGFLOW_POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/18/docker
      TZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'PGPASSWORD="$$APP_POSTGRES_PASSWORD" psql -h 127.0.0.1 -U "$$APP_POSTGRES_USER" -d "$$APP_POSTGRES_DATABASE" -Atqc "SELECT 1" >/dev/null && PGPASSWORD="$$RAGFLOW_POSTGRES_PASSWORD" psql -h 127.0.0.1 -U "$$RAGFLOW_POSTGRES_USER" -d "$$RAGFLOW_POSTGRES_DATABASE" -Atqc "SELECT 1" >/dev/null',
        ]
      interval: 5s
      timeout: 5s
      retries: 60
    networks: [ragflow-backplane]
    restart: unless-stopped

  redis-stack:
    # 一个 Redis Stack 同时提供普通 Redis 命令和 RediSearch 向量索引。
    # DB 0=精确/语义缓存，DB 1=RAGFlow 内部状态，DB 2=Celery Broker。
    # 这三个 DB 共享内存与持久化文件，因此使用 noeviction，内存不足时
    # 显式拒绝新写入，不得通过 LRU 静默删除队列任务或 RAGFlow 状态。
    image: ${REDIS_STACK_IMAGE}
    environment:
      REDIS_STACK_PASSWORD: ${REDIS_STACK_PASSWORD}
      REDIS_ARGS: >-
        --appendonly yes
        --appendfsync everysec
        --requirepass ${REDIS_STACK_PASSWORD}
        --maxmemory ${REDIS_STACK_MAXMEMORY:-1gb}
        --maxmemory-policy noeviction
    volumes:
      - redis_stack_data:/data
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_STACK_PASSWORD" --no-auth-warning ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 60
    networks: [ragflow-backplane]
    restart: unless-stopped

  elasticsearch:
    image: ${ELASTICSEARCH_IMAGE}
    environment:
      node.name: elasticsearch
      cluster.name: lazytt-ragflow
      discovery.type: single-node
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      bootstrap.memory_lock: "false"
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms1g -Xmx1g}
      cluster.routing.allocation.disk.watermark.low: 5gb
      cluster.routing.allocation.disk.watermark.high: 3gb
      cluster.routing.allocation.disk.watermark.flood_stage: 2gb
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u elastic:$$ELASTIC_PASSWORD http://127.0.0.1:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 90
      start_period: 30s
    networks: [ragflow-backplane]
    restart: unless-stopped

  minio:
    image: ${MINIO_IMAGE}
    command: ["server", "--console-address", ":9001", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 60
    networks: [ragflow-backplane]
    restart: unless-stopped

networks:
  ragflow-backplane:
    # 共享网络由启动脚本幂等创建，不归 storage 或 runtime 任一 Project 所有；
    # 因此单独停止某一层时不会误删另一层仍在使用的通信网络。
    external: true
    name: ${RAG_DOCKER_NETWORK:-lazytt-ragflow-poc_ragflow-backplane}

volumes:
  # ``name`` 固定为拆分前 Compose 创建的卷名，使升级过程原地复用已有数据。
  # 使用全新的共享卷，避免把两个旧 PostgreSQL 数据目录错误挂载到同一进程。
  # 旧的 app_postgres_data/ragflow_postgres_data 卷不会被 Compose 删除，仍可回退。
  postgres_data:
    name: lazytt-ragflow-poc_postgres_data
  # Redis 三实例合并使用全新卷，不把三份互不相容的 AOF/RDB
  # 文件直接拼接。历史 app/cache/ragflow Redis 卷不在此声明，但 Docker
  # 不会自动删除它们，可配合合并前 Git 检查点回退。
  redis_stack_data:
    name: lazytt-ragflow-poc_redis_stack_data
  elasticsearch_data:
    name: lazytt-ragflow-poc_elasticsearch_data
  minio_data:
    name: lazytt-ragflow-poc_minio_data
