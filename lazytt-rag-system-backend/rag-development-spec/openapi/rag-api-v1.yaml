# RAG Gateway v1 的公开 HTTP 第一事实来源；运行时路由由契约测试保证与其一致。
openapi: 3.1.0
info:
  title: RAG Service API
  version: 1.0.0
  description: |
    上游系统调用的稳定 RAG API。该 API 不提供用户、租户、Workspace、ACL、
    Source 或 IndexGeneration 管理能力；文档更新通过安全版本替换和回滚接口提供。
    当前联调阶段不提供注册、登录、密码或 JWT 验证。除健康、版本和能力接口外，
    调用方必须同时提交 X-Tenant-ID 与 X-User-ID；服务用两者派生调用主体范围，
    隔离查询、反馈、缓存和幂等记录。知识资源只存在 TENANT 与 SYSTEM 两种共享范围：
    同一租户的用户可访问该租户共享库，所有租户可访问系统共享库。这两个 Header
    不是认证凭据，生产环境必须由公司 Identity 通过可信内部链路或已验签 Claims 提供。
servers:
  - url: http://localhost:8080
    description: Local development
security:
  - directTenantId: []
    directUserId: []
tags:
  - name: System
  - name: KnowledgeBases
  - name: Documents
  - name: Jobs
  - name: Retrieval
  - name: Answers
  - name: Citations
  - name: Feedback

paths:
  /health/live:
    get:
      tags: [System]
      operationId: getLiveness
      summary: 进程存活检查
      security: []
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /health/ready:
    get:
      tags: [System]
      operationId: getReadiness
      summary: 下游依赖就绪检查
      security: []
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/version:
    get:
      tags: [System]
      operationId: getVersion
      summary: 查询服务版本
      security: []
      responses:
        '200':
          description: Version information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'
  /v1/capabilities:
    get:
      tags: [System]
      operationId: getCapabilities
      summary: 查询支持的文件、Profile 和功能开关
      security: []
      responses:
        '200':
          description: Capability information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilitiesResponse'

  /v1/knowledge-bases:
    get:
      tags: [KnowledgeBases]
      operationId: listSharedKnowledgeBases
      summary: 分页查询当前身份可访问的租户共享和系统共享知识库
      description: 只读用户接口；不授予任何创建、上传、修改或删除能力。
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: name
          in: query
          schema:
            type: string
            maxLength: 128
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/KnowledgeBaseStatus'
        - name: scope_type
          in: query
          description: 按租户共享或系统共享归属筛选
          schema:
            type: string
            enum: [TENANT, SYSTEM]
      responses:
        '200':
          description: 当前租户共享知识库和系统共享知识库分页结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeBasePageResponse'

  /v1/knowledge-bases/{knowledge_base_id}/documents:
    parameters:
      - $ref: '#/components/parameters/KnowledgeBaseId'
      - $ref: '#/components/parameters/RequestIdHeader'
    get:
      tags: [Documents]
      operationId: listSharedDocuments
      summary: 分页查询可访问共享知识库中的文档
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/DocumentStatus'
        - name: filename
          in: query
          schema:
            type: string
            maxLength: 255
        - name: external_id
          in: query
          schema:
            type: string
            maxLength: 128
      responses:
        '200':
          description: Page of readable documents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentPageResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/documents/{document_id}:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
      - $ref: '#/components/parameters/RequestIdHeader'
    get:
      tags: [Documents]
      operationId: getSharedDocument
      summary: 查询可访问共享知识库中的文档详情
      responses:
        '200':
          description: Readable document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/documents/{document_id}/chunks:
    get:
      tags: [Documents]
      operationId: listSharedDocumentChunks
      summary: 分页查询可访问共享文档的文本块
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Page of readable chunks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChunkPageResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/management/knowledge-bases:
    post:
      tags: [KnowledgeBases]
      operationId: createKnowledgeBase
      summary: 创建知识库
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateKnowledgeBaseRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeBaseResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          $ref: '#/components/responses/BadGateway'
    get:
      tags: [KnowledgeBases]
      operationId: listKnowledgeBases
      summary: 分页查询知识库
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: name
          in: query
          schema:
            type: string
            maxLength: 128
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/KnowledgeBaseStatus'
        - name: scope_type
          in: query
          description: 按租户共享或系统共享归属筛选
          schema:
            type: string
            enum: [TENANT, SYSTEM]
      responses:
        '200':
          description: Page of knowledge bases
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeBasePageResponse'

  /v1/management/knowledge-bases/{knowledge_base_id}:
    parameters:
      - $ref: '#/components/parameters/KnowledgeBaseId'
      - $ref: '#/components/parameters/RequestIdHeader'
    get:
      tags: [KnowledgeBases]
      operationId: getKnowledgeBase
      summary: 查询知识库详情
      responses:
        '200':
          description: Knowledge base
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeBaseResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [KnowledgeBases]
      operationId: updateKnowledgeBase
      summary: 修改知识库名称、描述和未来任务使用的 Profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateKnowledgeBaseRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeBaseResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [KnowledgeBases]
      operationId: deleteKnowledgeBase
      summary: 异步删除知识库
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - name: force
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '202':
          description: Delete job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAcceptedResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/management/knowledge-bases/{knowledge_base_id}/documents:
    parameters:
      - $ref: '#/components/parameters/KnowledgeBaseId'
      - $ref: '#/components/parameters/RequestIdHeader'
    post:
      tags: [Documents]
      operationId: uploadDocument
      summary: 上传单个文档并可自动启动解析
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                external_id:
                  type: string
                  maxLength: 128
                metadata:
                  type: string
                  description: JSON object serialized as a form field; maximum 16 KiB
                parser_profile:
                  type: string
                  maxLength: 128
                  description: Optional explicit Parser; omitted values use a compatible knowledge-base default, then configured selection rules
                chunk_profile:
                  type: string
                  maxLength: 128
                  description: Optional explicit Chunk profile; omitted values use the configured file-family recommendation
                auto_parse:
                  type: boolean
                  default: true
      responses:
        '202':
          description: Upload job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentAcceptedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
    get:
      tags: [Documents]
      operationId: listDocuments
      summary: 分页查询知识库文档
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/DocumentStatus'
        - name: filename
          in: query
          schema:
            type: string
            maxLength: 255
        - name: external_id
          in: query
          schema:
            type: string
            maxLength: 128
      responses:
        '200':
          description: Page of documents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentPageResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/management/documents/{document_id}:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
      - $ref: '#/components/parameters/RequestIdHeader'
    get:
      tags: [Documents]
      operationId: getDocument
      summary: 查询文档处理状态
      responses:
        '200':
          description: Document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Documents]
      operationId: deleteDocument
      summary: 异步删除文档及其索引
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - name: cancel_active
          in: query
          description: 为 true 时先取消进行中的解析任务，再排队删除文档
          schema:
            type: boolean
            default: false
      responses:
        '202':
          description: Delete job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAcceptedResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/management/documents/{document_id}/parse:
    post:
      tags: [Documents]
      operationId: parseDocument
      summary: 启动首次解析
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      responses:
        '202':
          description: Parse job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAcceptedResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/management/documents/{document_id}/versions:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
      - $ref: '#/components/parameters/RequestIdHeader'
    post:
      tags: [Documents]
      operationId: uploadDocumentVersion
      summary: 上传候选文件版本，旧活动版本继续服务直到异步安全发布
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                metadata:
                  type: string
                  description: JSON object serialized as a form field; maximum 16 KiB
                parser_profile:
                  type: string
                  maxLength: 128
                  description: Optional explicit Parser; omitted values reuse a compatible document Parser, then configured selection rules
                chunk_profile:
                  type: string
                  maxLength: 128
                  description: Optional explicit Chunk profile; omitted values use the new file family's recommendation
                mode:
                  $ref: '#/components/schemas/DocumentUpdateMode'
      responses:
        '202':
          description: Candidate version and update job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentVersionAcceptedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
    get:
      tags: [Documents]
      operationId: listDocumentVersions
      summary: 分页查询逻辑文档版本历史
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Page of document versions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentVersionPageResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/management/documents/{document_id}/versions/{version_id}/rollback:
    post:
      tags: [Documents]
      operationId: rollbackDocumentVersion
      summary: 把仍保留物理索引的退役版本异步重新发布为活动版本
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - $ref: '#/components/parameters/VersionId'
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      responses:
        '202':
          description: Rollback job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAcceptedResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/management/documents/{document_id}/reparse:
    post:
      tags: [Documents]
      operationId: reparseDocument
      summary: 使用指定 Profile 清除旧 Chunk 后重新解析
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReparseDocumentRequest'
      responses:
        '202':
          description: Reparse job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAcceptedResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/management/documents/{document_id}/retry:
    post:
      tags: [Documents]
      operationId: retryDocument
      summary: 重试失败文档任务
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      responses:
        '202':
          description: Retry job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAcceptedResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/management/documents/{document_id}/source:
    get:
      tags: [Documents]
      operationId: getDocumentSource
      summary: 只读预览指定修订的原始 PDF
      description: 先校验管理入口与资源 Scope，再流式读取已映射的 RAGFlow 原文件；仅 READY PDF，最大 100 MiB，不缓存、不重解析。
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - $ref: '#/components/parameters/RequestIdHeader'
        - name: document_revision
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: 原始 PDF 字节流；Cache-Control 为 no-store；中途长度或摘要错误会中断传输。
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          description: 原文件超过预览大小上限
        '415':
          description: 非 PDF 文档
        '502':
          description: 下游内容类型或协议无效
        '504':
          description: 原文件读取超时

  /v1/management/documents/{document_id}/chunks:
    get:
      tags: [Documents]
      operationId: listDocumentChunks
      summary: 查询文档 Chunk，用于验收和调试
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: document_revision
          in: query
          description: 可选；PDF 联动预览应与 source 请求使用同一修订，修订或解析状态变化时返回 409。
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Page of chunks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChunkPageResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/management/jobs/{job_id}:
    get:
      tags: [Jobs]
      operationId: getJob
      summary: 查询异步任务
      parameters:
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: Job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/management/jobs/{job_id}/cancel:
    post:
      tags: [Jobs]
      operationId: cancelJob
      summary: 请求取消异步任务
      parameters:
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      responses:
        '202':
          description: Cancellation requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/retrieval:
    post:
      tags: [Retrieval]
      operationId: retrieve
      summary: 执行纯检索，不调用 LLM
      description: >-
        仅检索认证 tenant_id 下的 TENANT 知识库，暂不检索 SYSTEM 知识库。
        knowledge_base_ids 为空时选择当前租户全部 READY 知识库；显式指定系统库、
        其他租户库或不存在的 ID 时统一返回 404。问答接口保持原有可见范围。
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetrievalRequest'
      responses:
        '200':
          description: Retrieval result; candidates may be empty
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrievalResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

  /v1/answers:
    post:
      tags: [Answers]
      operationId: createAnswer
      summary: 非流式 RAG 问答
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswerRequest'
      responses:
        '200':
          description: Answer, refusal, or no-evidence outcome
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

  /v1/answers/stream:
    post:
      tags: [Answers]
      operationId: streamAnswer
      summary: SSE 流式 RAG 问答
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswerRequest'
      responses:
        '200':
          description: Server-Sent Events; event schemas are documented in contracts/sse-events.json
          content:
            text/event-stream:
              schema:
                type: string
              example: |-
                event: accepted
                id: 1
                data: {"request_id":"...","sequence":1}

                event: completed
                id: 2
                data: {"request_id":"...","sequence":2,"outcome":"success"}
        '400':
          $ref: '#/components/responses/BadRequest'

  /v1/requests/{request_id}:
    get:
      tags: [Answers]
      operationId: getRequest
      summary: 查询问答请求状态和结果摘要
      parameters:
        - $ref: '#/components/parameters/RequestIdPath'
      responses:
        '200':
          description: Request record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestRecordResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/requests/{request_id}/cancel:
    post:
      tags: [Answers]
      operationId: cancelRequest
      summary: 取消正在执行的问答请求
      parameters:
        - $ref: '#/components/parameters/RequestIdPath'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      responses:
        '202':
          description: Cancellation requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestRecordResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/requests/{request_id}/citations:
    get:
      tags: [Citations]
      operationId: listRequestCitations
      summary: 查询回答引用
      parameters:
        - $ref: '#/components/parameters/RequestIdPath'
      responses:
        '200':
          description: Citations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CitationListResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/citations/{citation_id}:
    get:
      tags: [Citations]
      operationId: getCitation
      summary: 查询引用定位和摘录
      parameters:
        - $ref: '#/components/parameters/CitationId'
      responses:
        '200':
          description: Citation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CitationResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/feedback:
    post:
      tags: [Feedback]
      operationId: createFeedback
      summary: 提交回答或引用反馈
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFeedbackRequest'
      responses:
        '201':
          description: Feedback created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    directTenantId:
      type: apiKey
      in: header
      name: X-Tenant-ID
      description: |
        临时开发联调租户标识。它决定可访问的 TENANT 共享知识库，并与 X-User-ID
        共同派生调用主体范围；请求头本身没有密码学签名，不是认证凭据。
    directUserId:
      type: apiKey
      in: header
      name: X-User-ID
      description: |
        临时开发联调用户标识。它与 Tenant ID 共同派生调用主体范围，用于审计、缓存
        和幂等隔离，不作为知识库所有者；服务不验证调用者是否拥有这些身份。

  parameters:
    RequestIdHeader:
      name: X-Request-ID
      in: header
      required: false
      schema:
        type: string
        format: uuid
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[\x21-\x7E]+$'
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    KnowledgeBaseId:
      name: knowledge_base_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DocumentId:
      name: document_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VersionId:
      name: version_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RequestIdPath:
      name: request_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CitationId:
      name: citation_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated caller cannot execute this system-level operation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource does not exist in the current security scope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Resource state or idempotency conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PayloadTooLarge:
      description: Request or file too large
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnsupportedMediaType:
      description: Unsupported media type
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadGateway:
      description: Invalid or failed downstream response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: Dependency unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    GatewayTimeout:
      description: Downstream timeout
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ErrorDetail:
      type: object
      additionalProperties: false
      properties:
        field:
          type: string
        reason:
          type: string
      required: [reason]
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message, retryable]
      properties:
        code:
          type: string
          pattern: '^RAG-[A-Z]+-[0-9]{3}$'
        message:
          type: string
        retryable:
          type: boolean
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [request_id, error]
      properties:
        request_id:
          type: string
          format: uuid
        error:
          $ref: '#/components/schemas/ApiError'
    PageMeta:
      type: object
      additionalProperties: false
      required: [page, page_size, total]
      properties:
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer

    HealthStatus:
      type: string
      enum: [ok, degraded, unavailable]
    DependencyHealth:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/HealthStatus'
        latency_ms:
          type: number
          minimum: 0
        message:
          type: string
    HealthData:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/HealthStatus'
        dependencies:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/DependencyHealth'
    HealthResponse:
      type: object
      required: [request_id, data]
      properties:
        request_id:
          type: string
          format: uuid
        data:
          $ref: '#/components/schemas/HealthData'
    VersionData:
      type: object
      additionalProperties: false
      required: [api_version, build_commit, ragflow_contract_version]
      properties:
        api_version:
          type: string
        build_commit:
          type: string
        build_time:
          type: string
          format: date-time
        ragflow_contract_version:
          type: string
    VersionResponse:
      type: object
      required: [request_id, data]
      properties:
        request_id:
          type: string
          format: uuid
        data:
          $ref: '#/components/schemas/VersionData'
    CapabilitiesData:
      type: object
      additionalProperties: false
      required: [file_extensions, parser_profiles, chunk_profiles, retrieval_profiles, features]
      properties:
        file_extensions:
          type: array
          items:
            type: string
        max_file_bytes:
          type: integer
        parser_profiles:
          type: array
          items:
            type: string
        chunk_profiles:
          type: array
          items:
            type: string
        retrieval_profiles:
          type: array
          items:
            type: string
        features:
          type: object
          additionalProperties:
            type: boolean
    CapabilitiesResponse:
      type: object
      required: [request_id, data]
      properties:
        request_id:
          type: string
          format: uuid
        data:
          $ref: '#/components/schemas/CapabilitiesData'

    KnowledgeBaseStatus:
      type: string
      enum: [CREATING, READY, CREATE_FAILED, DELETING, DELETE_FAILED, DELETED]
    KnowledgeBaseScopeType:
      type: string
      enum: [TENANT, SYSTEM]
    CreateKnowledgeBaseRequest:
      type: object
      additionalProperties: false
      required: [scope_type, name, parser_profile, chunk_profile, embedding_profile, retrieval_profile]
      properties:
        scope_type:
          $ref: '#/components/schemas/KnowledgeBaseScopeType'
        external_id:
          type: string
          maxLength: 128
        name:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: string
          maxLength: 2048
        parser_profile:
          type: string
          maxLength: 128
        chunk_profile:
          type: string
          maxLength: 128
        embedding_profile:
          type: string
          maxLength: 128
        retrieval_profile:
          type: string
          maxLength: 128
    UpdateKnowledgeBaseRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: string
          maxLength: 2048
        parser_profile:
          type: string
          maxLength: 128
        chunk_profile:
          type: string
          maxLength: 128
        retrieval_profile:
          type: string
          maxLength: 128
    KnowledgeBase:
      type: object
      additionalProperties: false
      required: [id, scope_type, name, status, revision, parser_profile, chunk_profile, embedding_profile, retrieval_profile, document_count, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        scope_type:
          $ref: '#/components/schemas/KnowledgeBaseScopeType'
        external_id:
          type: [string, 'null']
        name:
          type: string
        description:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/KnowledgeBaseStatus'
        revision:
          type: integer
          minimum: 0
        parser_profile:
          type: string
        chunk_profile:
          type: string
        embedding_profile:
          type: string
        retrieval_profile:
          type: string
        document_count:
          type: integer
          minimum: 0
        reindex_required:
          type: boolean
          default: false
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    KnowledgeBaseResponse:
      type: object
      required: [request_id, data]
      properties:
        request_id:
          type: string
          format: uuid
        data:
          $ref: '#/components/schemas/KnowledgeBase'
    KnowledgeBasePageResponse:
      type: object
      required: [request_id, data, meta]
      properties:
        request_id:
          type: string
          format: uuid
        data:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeBase'
        meta:
          $ref: '#/components/schemas/PageMeta'

    DocumentStatus:
      type: string
      enum: [RECEIVED, UPLOADING, UPLOADED, QUEUED, PARSING, INDEXING, READY, FAILED, RETRYING, DELETING, DELETE_FAILED, DELETED]
    Document:
      type: object
      additionalProperties: false
      required: [id, knowledge_base_id, filename, mime_type, file_size_bytes, content_sha256, active_version_number, document_revision, parser_profile, chunk_profile, status, progress, chunk_count, token_count, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        knowledge_base_id:
          type: string
          format: uuid
        external_id:
          type: [string, 'null']
        filename:
          type: string
        mime_type:
          type: string
        file_size_bytes:
          type: integer
          minimum: 0
        content_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        active_version_id:
          type: [string, 'null']
          format: uuid
        active_version_number:
          type: integer
          minimum: 1
        document_revision:
          type: integer
          minimum: 1
        metadata:
          type: object
          additionalProperties: true
        parser_profile:
          type: string
        chunk_profile:
          type: string
        status:
          $ref: '#/components/schemas/DocumentStatus'
        progress:
          type: number
          minimum: 0
          maximum: 1
        chunk_count:
          type: integer
          minimum: 0
        token_count:
          type: integer
          minimum: 0
        last_error:
          anyOf:
            - $ref: '#/components/schemas/ApiError'
            - type: 'null'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        indexed_at:
          type: [string, 'null']
          format: date-time
    DocumentResponse:
      type: object
      required: [request_id, data]
      properties:
        request_id:
          type: string
          format: uuid
        data:
          $ref: '#/components/schemas/Document'
    DocumentPageResponse:
      type: object
      required: [request_id, data, meta]
      properties:
        request_id:
          type: string
          format: uuid
        data:
          type: array
          items:
            $ref: '#/components/schemas/Document'
        meta:
          $ref: '#/components/schemas/PageMeta'
    DocumentAcceptedData:
      type: object
      additionalProperties: false
      required: [document_id, job_id, status]
      properties:
        document_id:
          type: string
          format: uuid
        job_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/DocumentStatus'
    DocumentAcceptedResponse:
      type: object
      required: [request_id, data]
      properties:
        request_id:
          type: string
          format: uuid
        data:
          $ref: '#/components/schemas/DocumentAcceptedData'
    DocumentUpdateMode:
      type: string
      enum: [AUTO, SAFE_REPLACE]
      default: AUTO
      description: |
        AUTO 为能力协商入口；当前实现会明确降级为 SAFE_REPLACE。系统不会把整份
        重新解析伪装成 Chunk 增量复用，真实执行方式以响应 effective_mode 为准。
    DocumentVersionStatus:
      type: string
      enum: [PENDING, UPLOADING, PARSING, INDEXING, ACTIVE, RETIRED, FAILED]
    DocumentVersion:
      type: object
      additionalProperties: false
      required: [id, document_id, version_number, filename, mime_type, file_size_bytes, content_sha256, metadata, parser_profile, chunk_profile, status, requested_mode, effective_mode, chunk_count, token_count, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        document_id:
          type: string
          format: uuid
        version_number:
          type: integer
          minimum: 1
        filename:
          type: string
        mime_type:
          type: string
        file_size_bytes:
          type: integer
          minimum: 0
        content_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        metadata:
          type: object
          additionalProperties: true
        parser_profile:
          type: string
        chunk_profile:
          type: string
        status:
          $ref: '#/components/schemas/DocumentVersionStatus'
        requested_mode:
          $ref: '#/components/schemas/DocumentUpdateMode'
        effective_mode:
          $ref: '#/components/schemas/DocumentUpdateMode'
        chunk_count:
          type: integer
          minimum: 0
        token_count:
          type: integer
          minimum: 0
        last_error:
          anyOf:
            - $ref: '#/components/schemas/ApiError'
            - type: 'null'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        activated_at:
          type: [string, 'null']
          format: date-time
        retired_at:
          type: [string, 'null']
          format: date-time
    DocumentVersionPageResponse:
      type: object
      required: [request_id, data, meta]
      properties:
        request_id:
          type: string
          format: uuid
        data:
          type: array
          items:
            $ref: '#/components/schemas/DocumentVersion'
        meta:
          $ref: '#/components/schemas/PageMeta'
    DocumentVersionAcceptedData:
      type: object
      additionalProperties: false
      required: [document_id, version_id, version_number, job_id, status, effective_mode]
      properties:
        document_id:
          type: string
          format: uuid
        version_id:
          type: string
          format: uuid
        version_number:
          type: integer
          minimum: 1
        job_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/DocumentVersionStatus'
        effective_mode:
          $ref: '#/components/schemas/DocumentUpdateMode'
    DocumentVersionAcceptedResponse:
      type: object
      required: [request_id, data]
      properties:
        request_id:
          type: string
          format: uuid
        data:
          $ref: '#/components/schemas/DocumentVersionAcceptedData'
    ReparseDocumentRequest:
      type: object
      additionalProperties: false
      properties:
        parser_profile:
          type: string
          maxLength: 128
        chunk_profile:
          type: string
          maxLength: 128
    SourcePosition:
      type: object
      additionalProperties: false
      properties:
        page:
          type: integer
          minimum: 1
        bbox:
          type: array
          description: RAGFlow 的 left、right、top、bottom；PDF 单位为 72 DPI 页面坐标，不是 x1、y1、x2、y2。缺失或非标准页面不得猜测位置。
          minItems: 4
          maxItems: 4
          items:
            type: number
    Chunk:
      type: object
      additionalProperties: false
      required: [id, document_id, content]
      properties:
        id:
          type: string
        document_id:
          type: string
          format: uuid
        content:
          type: string
        positions:
          type: array
          items:
            $ref: '#/components/schemas/SourcePosition'
        metadata:
          type: object
          additionalProperties: true
    ChunkPageResponse:
      type: object
      required: [request_id, data, meta]
      properties:
        request_id:
          type: string
          format: uuid
        data:
          type: array
          items:
            $ref: '#/components/schemas/Chunk'
        meta:
          $ref: '#/components/schemas/PageMeta'

    JobStatus:
      type: string
      enum: [PENDING, RUNNING, RETRY_WAIT, SUCCEEDED, FAILED, CANCEL_REQUESTED, CANCELLED]
    Job:
      type: object
      additionalProperties: false
      required: [id, type, status, progress, attempt, max_attempts, created_at]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [UPLOAD, PARSE, REPARSE, UPDATE_DOCUMENT, DELETE_DOCUMENT, DELETE_KB, CLEANUP]
        status:
          $ref: '#/components/schemas/JobStatus'
        knowledge_base_id:
          type: [string, 'null']
          format: uuid
        document_id:
          type: [string, 'null']
          format: uuid
        progress:
          type: number
          minimum: 0
          maximum: 1
        attempt:
          type: integer
          minimum: 0
        max_attempts:
          type: integer
          minimum: 1
        error:
          anyOf:
            - $ref: '#/components/schemas/ApiError'
            - type: 'null'
        created_at:
          type: string
          format: date-time
        started_at:
          type: [string, 'null']
          format: date-time
        finished_at:
          type: [string, 'null']
          format: date-time
    JobResponse:
      type: object
      required: [request_id, data]
      properties:
        request_id:
          type: string
          format: uuid
        data:
          $ref: '#/components/schemas/Job'
    JobAcceptedData:
      type: object
      additionalProperties: false
      required: [job_id, status]
      properties:
        job_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/JobStatus'
    JobAcceptedResponse:
      type: object
      required: [request_id, data]
      properties:
        request_id:
          type: string
          format: uuid
        data:
          $ref: '#/components/schemas/JobAcceptedData'

    MetadataCondition:
      type: object
      additionalProperties: false
      required: [field, operator]
      properties:
        field:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,63}$'
        operator:
          type: string
          enum: [eq, ne, contains, not_contains, starts_with, empty, not_empty, gt, gte, lt, lte]
        value: {}
    MetadataFilter:
      type: object
      additionalProperties: false
      required: [logic, conditions]
      properties:
        logic:
          type: string
          enum: [and, or]
        conditions:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/MetadataCondition'
    RetrievalOptions:
      type: object
      additionalProperties: false
      properties:
        page_size:
          type: integer
          minimum: 1
          maximum: 50
          default: 10
        include_content:
          type: boolean
          default: true
        include_positions:
          type: boolean
          default: true
    RetrievalRequest:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        knowledge_base_ids:
          type: array
          maxItems: 20
          uniqueItems: true
          default: []
          items:
            type: string
            format: uuid
        document_ids:
          type: array
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            format: uuid
        query:
          type: string
          minLength: 1
          maxLength: 8000
        metadata_filter:
          $ref: '#/components/schemas/MetadataFilter'
        retrieval_profile:
          type: string
          maxLength: 128
          default: hybrid-structure-aware@6
        options:
          $ref: '#/components/schemas/RetrievalOptions'
    RetrievalScores:
      type: object
      additionalProperties: false
      required: [score]
      properties:
        score:
          type: number
        vector_score:
          type: [number, 'null']
        term_score:
          type: [number, 'null']
        rerank_score:
          type: [number, 'null']
    RetrievalCandidate:
      type: object
      additionalProperties: false
      required: [chunk_id, knowledge_base_id, document_id, document_name, content, scores, metadata, positions]
      properties:
        chunk_id:
          type: string
        knowledge_base_id:
          type: string
          format: uuid
        document_id:
          type: string
          format: uuid
        document_name:
          type: string
        heading_path:
          type: array
          items:
            type: string
        content:
          type: string
        positions:
          type: array
          items:
            $ref: '#/components/schemas/SourcePosition'
        scores:
          $ref: '#/components/schemas/RetrievalScores'
        metadata:
          type: object
          additionalProperties: true
    QueryPlan:
      type: object
      additionalProperties: false
      description: >-
        本次请求实际使用的语言、查询类型、检索路线和三阶段动态预算。预算是配置
        上限，不等于最终去重和重排后的候选数量；旧答案缓存可能返回 null。
      required:
        [detected_language, variants, knowledge_languages, retrieval_routes,
         query_type, retrieval_top_k, rerank_top_n, context_top_n]
      properties:
        detected_language:
          type: string
          enum: [zh-CN, en-US]
        variants:
          type: object
          additionalProperties:
            type: string
        knowledge_languages:
          type: array
          items:
            type: string
            enum: [zh-CN, en-US]
        retrieval_routes:
          type: array
          items:
            type: string
        query_type:
          anyOf:
            - type: string
              enum: [fact, list, comparison, summary, multi_hop]
            - type: 'null'
        retrieval_top_k:
          anyOf:
            - type: integer
              minimum: 1
            - type: 'null'
        rerank_top_n:
          anyOf:
            - type: integer
              minimum: 1
            - type: 'null'
        context_top_n:
          anyOf:
            - type: integer
              minimum: 1
            - type: 'null'
    RetrievalData:
      type: object
      additionalProperties: false
      required: [original_query, effective_query, query_plan, candidates, total]
      properties:
        original_query:
          type: string
        effective_query:
          type: string
        query_plan:
          $ref: '#/components/schemas/QueryPlan'
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/RetrievalCandidate'
        total:
          type: integer
          minimum: 0
        warnings:
          type: array
          items:
            type: string
    RetrievalResponse:
      type: object
      required: [request_id, data]
      properties:
        request_id:
          type: string
          format: uuid
        data:
          $ref: '#/components/schemas/RetrievalData'

    ChatMessage:
      type: object
      additionalProperties: false
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          maxLength: 10000
    AnswerRequest:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        knowledge_base_ids:
          type: array
          maxItems: 20
          uniqueItems: true
          default: []
          items:
            type: string
            format: uuid
        query:
          type: string
          minLength: 1
          maxLength: 8000
        messages:
          type: array
          maxItems: 12
          items:
            $ref: '#/components/schemas/ChatMessage'
        metadata_filter:
          $ref: '#/components/schemas/MetadataFilter'
        retrieval_profile:
          type: string
          maxLength: 128
          default: hybrid-structure-aware@6
        generation_profile:
          type: string
          maxLength: 128
          default: answer-openai-compatible@4
        response_language:
          type: string
          enum: [zh-CN, en-US]
          default: zh-CN
    Usage:
      type: object
      additionalProperties: false
      required: [prompt_tokens, completion_tokens, total_tokens]
      properties:
        prompt_tokens:
          type: integer
          minimum: 0
        completion_tokens:
          type: integer
          minimum: 0
        total_tokens:
          type: integer
          minimum: 0
    Citation:
      type: object
      additionalProperties: false
      required: [citation_id, label, document_id, document_name, quote]
      properties:
        citation_id:
          type: string
          format: uuid
        label:
          type: string
          pattern: '^C[1-9][0-9]*$'
        knowledge_base_id:
          type: string
          format: uuid
        document_id:
          type: string
          format: uuid
        document_name:
          type: string
        heading_path:
          type: array
          items:
            type: string
        page_start:
          type: [integer, 'null']
          minimum: 1
        page_end:
          type: [integer, 'null']
          minimum: 1
        positions:
          type: array
          items:
            $ref: '#/components/schemas/SourcePosition'
        quote:
          type: string
        score:
          type: [number, 'null']
    AnswerOutcome:
      type: string
      enum: [success, no_evidence, refused, cancelled]
    AnswerData:
      type: object
      additionalProperties: false
      required:
        [answer, outcome, response_language, original_query, effective_query,
         query_rewritten, query_plan, citations, warnings, meta]
      properties:
        answer:
          type: string
        outcome:
          $ref: '#/components/schemas/AnswerOutcome'
        response_language:
          type: string
          enum: [zh-CN, en-US]
        original_query:
          type: string
        effective_query:
          type: string
        query_rewritten:
          type: boolean
        query_plan:
          $ref: '#/components/schemas/QueryPlan'
        citations:
          type: array
          items:
            $ref: '#/components/schemas/Citation'
        warnings:
          type: array
          items:
            type: string
        usage:
          anyOf:
            - $ref: '#/components/schemas/Usage'
            - type: 'null'
        meta:
          $ref: '#/components/schemas/AnswerMeta'
    AnswerMeta:
      type: object
      additionalProperties: false
      required: [cache_type]
      properties:
        cache_type:
          type: string
          enum: [none, exact, semantic]
    AnswerResponse:
      type: object
      required: [request_id, data]
      properties:
        request_id:
          type: string
          format: uuid
        data:
          $ref: '#/components/schemas/AnswerData'
    RequestRecord:
      type: object
      additionalProperties: false
      required: [request_id, status, created_at]
      properties:
        request_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [ACCEPTED, RUNNING, COMPLETED, FAILED, CANCELLED]
        outcome:
          anyOf:
            - $ref: '#/components/schemas/AnswerOutcome'
            - type: 'null'
        answer:
          type: [string, 'null']
        warnings:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        completed_at:
          type: [string, 'null']
          format: date-time
    RequestRecordResponse:
      type: object
      required: [request_id, data]
      properties:
        request_id:
          type: string
          format: uuid
        data:
          $ref: '#/components/schemas/RequestRecord'
    CitationResponse:
      type: object
      required: [request_id, data]
      properties:
        request_id:
          type: string
          format: uuid
        data:
          $ref: '#/components/schemas/Citation'
    CitationListResponse:
      type: object
      required: [request_id, data]
      properties:
        request_id:
          type: string
          format: uuid
        data:
          type: array
          items:
            $ref: '#/components/schemas/Citation'

    FeedbackType:
      type: string
      enum: [helpful, not_helpful, answer_incorrect, citation_incorrect, should_answer, should_refuse, other]
    CreateFeedbackRequest:
      type: object
      additionalProperties: false
      required: [request_id, feedback_type]
      properties:
        request_id:
          type: string
          format: uuid
        rating:
          type: [integer, 'null']
          enum: [-1, 1, null]
        feedback_type:
          $ref: '#/components/schemas/FeedbackType'
        comment:
          type: string
          maxLength: 4000
        corrected_answer:
          type: string
          maxLength: 20000
    Feedback:
      type: object
      additionalProperties: false
      required: [id, request_id, feedback_type, created_at]
      properties:
        id:
          type: string
          format: uuid
        request_id:
          type: string
          format: uuid
        rating:
          type: [integer, 'null']
        feedback_type:
          $ref: '#/components/schemas/FeedbackType'
        created_at:
          type: string
          format: date-time
    FeedbackResponse:
      type: object
      required: [request_id, data]
      properties:
        request_id:
          type: string
          format: uuid
        data:
          $ref: '#/components/schemas/Feedback'
